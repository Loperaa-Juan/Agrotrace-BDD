serenity {
  # Recorrido encadenado: los escenarios comparten el mismo navegador.
  restart.browser.for.each = never

  take.screenshots = FOR_EACH_ACTION
}

# Pausas visuales (en milisegundos) para que la ejecución se parezca a la de una persona.
agrotrace {
  pausa {
    # Después de cada paso del feature
    paso = 300
    # Después de llenar cada campo de un formulario
    campo = 100
  }
}
